version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistia_postgres_teinco
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teinco_secure_password_2026
      POSTGRES_DB: asistia_teinco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistia_teinco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
